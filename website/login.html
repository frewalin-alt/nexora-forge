<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090812">
  <title>Anmelden · Nexora Forge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
  <main class="login-shell">
    <section class="login-card">
      <div class="login-logo">✦</div>
      <div class="login-brand">NEXORA <span>FORGE</span></div>
      <div class="login-label">YOUR ROBLOX DEVELOPMENT WORKSPACE</div>

      <h1>Welcome back.</h1>
      <p class="login-description">
        Sign in with your Roblox account and build
        your next game ideas with Nexora AI.
      </p>

      <a class="login-button" href="/api/auth/roblox/login">
        <span class="roblox-mark">R</span>
        Sign in with Roblox
        <span class="login-arrow">↗</span>
      </a>

      <p id="login-notice" class="login-notice" role="status"></p>

      <div class="login-divider"></div>
      <div class="login-security">
        <span>●</span> Secure sign-in with Roblox OAuth
      </div>
    </section>

    <footer class="login-footer">
      NEXORA FORGE <span>·</span> BUILT FOR CREATORS
    </footer>
  </main>
  <script src="login.js"></script>
</body>
</html>
